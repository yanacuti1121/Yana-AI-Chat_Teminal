[package]
name = "yana-terminal"
version = "0.1.0"
edition = "2021"
description = "Terminal-native local AI workspace for Yana"
license = "Apache-2.0"
authors = ["Vũ Văn Tâm"]

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
